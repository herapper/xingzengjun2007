<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>邢增俊｜摄影集</title>
  <meta name="description" content="邢增俊的个人摄影作品集">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    header {
      width: min(1400px, calc(100% - 40px));
      margin: auto;
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
    }

    main {
      width: min(1400px, calc(100% - 40px));
      margin: auto;
    }

    .intro {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 0;
    }

    .intro small {
      color: #888;
      letter-spacing: 3px;
    }

    h1 {
      max-width: 900px;
      margin: 18px 0;
      font-size: clamp(42px, 8vw, 110px);
      line-height: 1.05;
    }

    .intro p {
      max-width: 600px;
      color: #aaa;
      font-size: 17px;
      line-height: 1.8;
    }

    .gallery-title {
      padding: 40px 0 20px;
      border-top: 1px solid #333;
    }

    .gallery {
      columns: 3;
      column-gap: 16px;
      padding-bottom: 100px;
    }

    figure {
      margin: 0 0 22px;
      break-inside: avoid;
    }

    figure a {
      display: block;
      overflow: hidden;
    }

    figure img {
      display: block;
      width: 100%;
      transition: transform 0.4s, opacity 0.4s;
    }

    figure img:hover {
      transform: scale(1.02);
      opacity: 0.85;
    }

    figcaption {
      padding-top: 8px;
      color: #888;
      font-size: 13px;
    }

    .about {
      padding: 100px 0;
      border-top: 1px solid #333;
    }

    .about h2 {
      font-size: 36px;
    }

    .about p {
      max-width: 700px;
      color: #aaa;
      font-size: 17px;
      line-height: 1.9;
    }

    footer {
      width: min(1400px, calc(100% - 40px));
      margin: auto;
      padding: 35px 0;
      border-top: 1px solid #333;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .gallery {
        columns: 2;
      }
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
      }

      .gallery {
        columns: 1;
      }

      .intro {
        min-height: 55vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">邢增俊摄影集</div>

    <nav>
      <a href="#works">作品</a>
      <a href="#about">关于</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <small>PHOTOGRAPHY PORTFOLIO</small>
      <h1>记录光线、空间与偶然发生的瞬间。</h1>
      <p>
        欢迎来到我的个人摄影集。这里收录了我在旅行、城市和日常生活中拍摄的作品。
      </p>
    </section>

    <section id="works">
      <h2 class="gallery-title">摄影作品</h2>

      <div class="gallery">
        <figure>
          <a href="images/photo-01.jpg" target="_blank">
            <img src="images/photo-01.jpg" alt="摄影作品一">
          </a>
          <figcaption>作品 01</figcaption>
        </figure>

        <figure>
          <a href="images/photo-02.jpg" target="_blank">
            <img src="images/photo-02.jpg" alt="摄影作品二" loading="lazy">
          </a>
          <figcaption>作品 02</figcaption>
        </figure>

        <figure>
          <a href="images/photo-03.jpg" target="_blank">
            <img src="images/photo-03.jpg" alt="摄影作品三" loading="lazy">
          </a>
          <figcaption>作品 03</figcaption>
        </figure>

        <figure>
          <a href="images/photo-04.jpg" target="_blank">
            <img src="images/photo-04.jpg" alt="摄影作品四" loading="lazy">
          </a>
          <figcaption>作品 04</figcaption>
        </figure>

        <figure>
          <a href="images/photo-05.jpg" target="_blank">
            <img src="images/photo-05.jpg" alt="摄影作品五" loading="lazy">
          </a>
          <figcaption>作品 05</figcaption>
        </figure>

        <figure>
          <a href="images/photo-06.jpg" target="_blank">
            <img src="images/photo-06.jpg" alt="摄影作品六" loading="lazy">
          </a>
          <figcaption>作品 06</figcaption>
        </figure>
      </div>
    </section>

    <section id="about" class="about">
      <h2>关于我</h2>
      <p>
        我是邢增俊，一名摄影爱好者。我用照片记录生活中容易被忽略的光线、人物和空间。
        这里展示的是我的部分摄影作品，网站也会随着新的拍摄持续更新。
      </p>
    </section>
  </main>

  <footer>
    © 2026 邢增俊 · All photographs are copyrighted.
  </footer>
</body>
</html>
